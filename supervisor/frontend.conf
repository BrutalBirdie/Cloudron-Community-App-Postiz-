[program:frontend]
priority=10
directory=/app/code/dist/apps/frontend
environment=PORT=4200
command=bash -c "source /run/postiz/env.sh && npx next start -p 4200"
user=cloudron
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
