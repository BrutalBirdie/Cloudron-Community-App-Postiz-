[program:frontend]
priority=10
directory=/app/code/apps/frontend
command=/app/code/node_modules/.bin/next start -p 4200 -H 127.0.0.1
user=cloudron
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
