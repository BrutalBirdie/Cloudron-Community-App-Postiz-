[program:orchestrator]
priority=5
directory=/app/code/apps/orchestrator
environment=ORCHESTRATOR_PORT=3002
command=node --experimental-require-module ./dist/apps/orchestrator/src/main.js
user=cloudron
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
