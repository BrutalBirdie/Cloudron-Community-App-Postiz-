[program:workers]
priority=5
directory=/app/code
#environment=
command=bash -c "source /run/postiz/env.sh && npm run start:prod:workers"
user=cloudron
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
